<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint"><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V64 M32 0V64" stroke="#9E917F" stroke-width="0.6" opacity="0.14"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#544738"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#AF3029"/>
    </marker>
    <clipPath id="q-left"><rect x="1090" y="90" width="310" height="900"/></clipPath>
    <style>
      .roman { font-family: "Latin Modern Roman", "Computer Modern", serif; }
      .mono { font-family: "Latin Modern Mono", monospace; }
      .ink { fill:#2B2318; }
      .muted { fill:#9E917F; }
      .red { fill:#AF3029; }
      .hair { fill:none; stroke:#9E917F; stroke-width:1.2; opacity:.58; }
      .inkline { fill:none; stroke:#544738; stroke-width:1.4; }
      .redline { fill:none; stroke:#AF3029; stroke-width:2.2; }
      .node { fill:#F5EDDA; stroke:#544738; stroke-width:1.5; }
      .rnode { fill:#F5EDDA; stroke:#AF3029; stroke-width:2; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F5EDDA" filter="url(#paper)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Exact KMP prefix table -->
  <g transform="translate(70 112)">
    <rect width="1012" height="242" rx="4" fill="#FAF5E8" opacity=".32" stroke="#9E917F" stroke-width="1.2"/>
    <line x1="0" y1="70" x2="1012" y2="70" class="hair"/>
    <line x1="0" y1="160" x2="1012" y2="160" class="hair"/>
    <g class="hair">
      <path d="M92 0V242 M184 0V242 M276 0V242 M368 0V242 M460 0V242 M552 0V242 M644 0V242 M736 0V242 M828 0V242 M920 0V242"/>
    </g>
    <g class="mono muted" font-size="18" text-anchor="middle">
      <text x="46" y="42">0</text><text x="138" y="42">1</text><text x="230" y="42">2</text><text x="322" y="42">3</text>
      <text x="414" y="42">4</text><text x="506" y="42">5</text><text x="598" y="42">6</text><text x="690" y="42">7</text>
      <text x="782" y="42">8</text><text x="874" y="42">9</text><text x="966" y="42">10</text>
    </g>
    <g class="roman ink" font-size="60" text-anchor="middle">
      <text x="46" y="140">A</text><text x="138" y="140">B</text><text x="230" y="140">R</text><text x="322" y="140">A</text>
      <text x="414" y="140">C</text><text x="506" y="140">A</text><text x="598" y="140">D</text><text x="690" y="140">A</text>
      <text x="782" y="140">B</text><text x="874" y="140">R</text><text x="966" y="140">A</text>
    </g>
    <g class="mono red" font-size="28" text-anchor="middle">
      <text x="46" y="210">0</text><text x="138" y="210">0</text><text x="230" y="210">0</text><text x="322" y="210">1</text>
      <text x="414" y="210">0</text><text x="506" y="210">1</text><text x="598" y="210">0</text><text x="690" y="210">1</text>
      <text x="782" y="210">2</text><text x="874" y="210">3</text><text x="966" y="210">4</text>
    </g>
    <path d="M46 70H966" class="redline" opacity=".78"/>
    <g fill="#F5EDDA" stroke="#AF3029" stroke-width="1.7">
      <circle cx="46" cy="70" r="5"/><circle cx="138" cy="70" r="5"/><circle cx="230" cy="70" r="5"/><circle cx="322" cy="70" r="5"/>
      <circle cx="414" cy="70" r="5"/><circle cx="506" cy="70" r="5"/><circle cx="598" cy="70" r="5"/><circle cx="690" cy="70" r="5"/>
      <circle cx="782" cy="70" r="5"/><circle cx="874" cy="70" r="5"/><circle cx="966" cy="70" r="5"/>
    </g>
  </g>

  <!-- KMP state chain and selected failure links -->
  <g transform="translate(72 510)">
    <path d="M22 0H1015" class="inkline" marker-end="url(#arrow)"/>
    <g class="mono" font-size="15" text-anchor="middle">
      <g><circle cx="22" cy="0" r="24" class="node"/><text x="22" y="5" class="ink">q0</text></g>
      <g><circle cx="112" cy="0" r="24" class="node"/><text x="112" y="5" class="ink">q1</text></g>
      <g><circle cx="202" cy="0" r="24" class="node"/><text x="202" y="5" class="ink">q2</text></g>
      <g><circle cx="292" cy="0" r="24" class="node"/><text x="292" y="5" class="ink">q3</text></g>
      <g><circle cx="382" cy="0" r="24" class="rnode"/><text x="382" y="5" class="red">q4</text></g>
      <g><circle cx="472" cy="0" r="24" class="node"/><text x="472" y="5" class="ink">q5</text></g>
      <g><circle cx="562" cy="0" r="24" class="rnode"/><text x="562" y="5" class="red">q6</text></g>
      <g><circle cx="652" cy="0" r="24" class="node"/><text x="652" y="5" class="ink">q7</text></g>
      <g><circle cx="742" cy="0" r="24" class="rnode"/><text x="742" y="5" class="red">q8</text></g>
      <g><circle cx="832" cy="0" r="24" class="rnode"/><text x="832" y="5" class="red">q9</text></g>
      <g><circle cx="922" cy="0" r="24" class="rnode"/><text x="922" y="5" class="red">q10</text></g>
      <g><circle cx="1012" cy="0" r="24" class="rnode"/><text x="1012" y="5" class="red">q11</text></g>
    </g>
    <g class="roman ink" font-size="19" text-anchor="middle">
      <text x="67" y="-15">A</text><text x="157" y="-15">B</text><text x="247" y="-15">R</text><text x="337" y="-15">A</text>
      <text x="427" y="-15">C</text><text x="517" y="-15">A</text><text x="607" y="-15">D</text><text x="697" y="-15">A</text>
      <text x="787" y="-15">B</text><text x="877" y="-15">R</text><text x="967" y="-15">A</text>
    </g>
    <g class="hair" marker-end="url(#arrow)">
      <path d="M382 -24C350 -104 154 -104 112 -24"/>
      <path d="M562 24C520 112 158 112 112 24"/>
      <path d="M742 -24C672 -142 188 -142 112 -24"/>
      <path d="M832 24C780 154 256 154 202 24"/>
      <path d="M922 -24C842 -182 370 -182 292 -24"/>
      <path d="M1012 24C940 192 452 192 382 24"/>
    </g>
    <path d="M382 0H562M562 0H742M742 0H832M832 0H922M922 0H1012" class="redline" marker-end="url(#red-arrow)"/>
  </g>

  <!-- Lower KMP comparison field, no unrelated geometry -->
  <g transform="translate(92 720)" opacity=".82">
    <g class="mono muted" font-size="15"><text x="0" y="0">i</text><text x="0" y="55">j</text><text x="0" y="110">π[j]</text></g>
    <g class="hair"><path d="M58 0H950M58 55H950M58 110H950"/></g>
    <g fill="#F5EDDA" stroke="#9E917F" stroke-width="1.2">
      <circle cx="92" cy="0" r="5"/><circle cx="172" cy="0" r="5"/><circle cx="252" cy="0" r="5"/><circle cx="332" cy="0" r="5"/><circle cx="412" cy="0" r="5"/><circle cx="492" cy="0" r="5"/><circle cx="572" cy="0" r="5"/><circle cx="652" cy="0" r="5"/><circle cx="732" cy="0" r="5"/><circle cx="812" cy="0" r="5"/><circle cx="892" cy="0" r="5"/>
    </g>
    <path d="M92 0C172 55 252 55 332 0S492 0 572 55S732 110 892 0" class="redline" opacity=".7"/>
    <path d="M92 145H892" class="hair"/><path d="M92 165H732" class="hair"/><path d="M252 185H892" class="hair"/>
    <g class="roman muted" font-size="17" letter-spacing="22"><text x="92" y="150">ABRACADABRA</text><text x="92" y="170">ABRACADABRA</text><text x="252" y="190">ABRACADABRA</text></g>
  </g>

  <!-- True Latin Modern Roman Q: outline and half-filled specimen -->
  <g aria-label="Latin Modern Roman Q">
    <text x="1080" y="875" class="roman" font-size="820" fill="none" stroke="#544738" stroke-width="2.1">Q</text>
    <text x="1080" y="875" class="roman ink" font-size="820" clip-path="url(#q-left)">Q</text>
    <line x1="1088" y1="186" x2="1840" y2="186" class="hair"/><line x1="1088" y1="875" x2="1840" y2="875" class="hair"/>
    <line x1="1400" y1="112" x2="1400" y2="998" class="hair"/><line x1="1620" y1="112" x2="1620" y2="998" class="hair"/>
    <g fill="#F5EDDA" stroke="#9E917F" stroke-width="1.4">
      <circle cx="1400" cy="186" r="6"/><circle cx="1620" cy="186" r="6"/><circle cx="1400" cy="875" r="6"/><circle cx="1620" cy="875" r="6"/>
    </g>
  </g>

  <!-- Execution path connects algorithm to the real Q -->
  <path d="M1084 510C1170 510 1210 560 1270 635C1340 723 1412 844 1512 884C1614 925 1746 916 1810 836" class="redline" marker-end="url(#red-arrow)"/>
  <g fill="#F5EDDA" stroke="#AF3029" stroke-width="2">
    <circle cx="1084" cy="510" r="6"/><circle cx="1270" cy="635" r="6"/><circle cx="1512" cy="884" r="6"/><circle cx="1810" cy="836" r="6"/>
  </g>

  <g class="mono muted" font-size="13" letter-spacing="2">
    <text x="72" y="1030">FAST PATTERN MATCHING IN STRINGS · P71</text>
    <text x="1680" y="1030">CMR10 / Q</text>
  </g>
</svg>
